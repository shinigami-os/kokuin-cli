[workspace]
resolver = "3"
members = ["crates/*", "bins/*"]
# The EFI probe only builds for UEFI (`--target x86_64-unknown-uefi -p kokuin-probe`):
# plain `cargo build` and `cargo test` leave it out.
default-members = ["crates/*", "bins/kokuin-cli", "bins/kokuin-init"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "GPL-2.0-only"
repository = "https://github.com/shinigami-os/kokuin-cli"

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = true
codegen-units = 1
strip = true
