[package]
name = "kokuin-cli"
version.workspace = true
description = "Boot flow recorder and explainer: from the power button to a usable desktop"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anstream = "1.0.0"
anstyle = "1.0.14"
clap = { version = "4.6.7", features = ["derive"] }
kokuin-analyze = { version = "0.1.0", path = "../../crates/kokuin-analyze" }
kokuin-bootcfg = { version = "0.1.0", path = "../../crates/kokuin-bootcfg" }
kokuin-kb = { version = "0.1.0", path = "../../crates/kokuin-kb" }
kokuin-model = { version = "0.1.0", path = "../../crates/kokuin-model" }
kokuin-recorder = { version = "0.1.0", path = "../../crates/kokuin-recorder" }
kokuin-sources = { version = "0.1.0", path = "../../crates/kokuin-sources" }
regex = "1.13.1"
rustix = { version = "1.1.6", features = ["fs", "process"] }
serde = "1.0.229"
serde_json = "1.0.154"

[lints]
workspace = true
